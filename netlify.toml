[build]
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Crawler diari — 07:00 UTC cada dia
[functions.clipping-crawler]
  schedule = "0 7 * * *"

# Timeout ampliat per al crawler (màxim Netlify: 26 segons plans gratuïts)
[functions."clipping-crawler"]
  timeout = 26
